interface:
  display_name: "hugentics-codebase-cleaner"
  short_description: "Scan-design-execute code cleanup via the hugentic harness"
  default_prompt: "Use $hugentics-codebase-cleaner to improve this repository in place: scan for cleanup targets, produce an Impl.Req via hugentics-impl-designer, confirm with the user, then execute via hugentics-impl-executer in Alignment.Mode:Gated. Summarize the changes at the end."
