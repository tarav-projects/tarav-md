interface:
  display_name: "agentos-session-zip-transcript"
  short_description: "Resolve, extract, and compress a prior chat session into a self-described live-note artifact"
  default_prompt: "Run this skill as a separate agent by default. Load `references/subagent-workflow.md` from the skill directory and follow it. Given a session id, session URI, or session query, resolve, export, compress, and write the compressed transcript to `notes/live/` in the owning Agentos.Project. If the owning Agentos.Project is unclear, stop and complain instead of guessing. Return only the short manifest unless inline output was explicitly requested."
