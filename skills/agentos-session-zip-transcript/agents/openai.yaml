interface:
  display_name: "agentos-session-zip-transcript"
  short_description: "Resolve, extract, and compress a prior chat session into a self-described live-note artifact"
  default_prompt: "Run this skill as a separate agent by default. Given a session id, session URI, or session query, resolve the chat session with `agentos chatlas query --include-match`, export it with `agentos chatlas export --view zip-transcript --format json`, compress it, write the compressed transcript to `notes/live/NNN-session-zip-transcript-<short-session-id>.md` in the owning Agentos.Project, and return only a short manifest. If the owning Agentos.Project is unclear, stop and complain instead of guessing. Allocate the live-note prefix with `agentos stdlib prefix next --project-base <project-root-basename> --target notes/live`, using `--project <project-root>` when needed. Never overwrite an existing live note path. Preserve every user turn in full. Compress every assistant turn to the shortest direct form that keeps new information. Use `turns` as the primary ordered turn source and each turn's `text` field as the plain turn text. The `zip-transcript` view already filters to visible user/assistant text content, so do not expect raw event tape, message ids, source refs, images, encrypted content, opaque reasoning, tool payloads, or normalization metadata. Keep short high-signal outputs verbatim only when useful; compress long structured outputs into short factual summaries instead of copying them wholesale. Drop progress narration and process chatter. The live-note artifact must begin with an explicit notice that it is compressed and not the original transcript, and include a short provenance header with the source session id, resolved URI, and the resolve/extract commands used. The returned manifest should include path, source session id, source URI, resolve/extract commands, turn count, and artifact size. If resolution is ambiguous, stop and report the candidate sessions instead of guessing."
